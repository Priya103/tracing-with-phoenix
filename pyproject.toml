[project]
name = "tracing-with-phoenix"
version = "0.1.0"
description = "Movie recommender evaluated with DeepEval, instrumented with Arize Phoenix for LLM tracing."
requires-python = ">=3.13.9"
dependencies = [
    "anthropic>=0.40.0",
    "deepeval>=1.5.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
tracing = [
    "arize-phoenix-otel",                          # thin OTLP exporter wrapper
    "arize-phoenix-client",                        # needed for log_span_annotations_dataframe
    "openinference-instrumentation-anthropic",
    "openinference-instrumentation-openai",
    "pandas",                                       # dataframes for annotation upload
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "opentelemetry-instrumentation-fastapi",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["recommender*", "evaluation*", "tracing*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
